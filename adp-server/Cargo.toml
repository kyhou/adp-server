[package]
name = "adp-server"
version = "0.1.0"
edition = "2021"
description = "Reference implementation of an ADP-01 (Arcadestr Distribution Protocol) server."

[dependencies]
futures-util = "0.3"
tempfile = "3"
adp-core = { path = "../adp-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
lightning-invoice = { workspace = true }
nostr-sdk = { workspace = true }
axum = { version = "0.7", features = ["multipart"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
aes-gcm = "0.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
async-trait = "0.1"
tower-http = { version = "0.6", features = ["trace"] }
base64 = "0.22"
# Publisher relay transport (src/publisher_relays.rs). Versions match
# nostr-relay-pool so its WebSocket types are shared.
async-wsocket = "0.13"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = "2"

[dev-dependencies]
native-tls = "0.2"
reqwest = { version = "0.12", features = ["native-tls"], default-features = false }
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
bitcoin = "0.32"
base64 = "0.22"
lightning-invoice = { workspace = true }
tokio-tungstenite = "0.26"
# TLS terminator for publisher relay tests (tests/fixtures/publisher-relay-tls).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rand = "0.8"
secp256k1 = "0.29"
